# Name: data_pipeline.yml
# Description: This workflow will install Python dependencies, run tests and lint with a single version of Python
# Date: 6/7/2026
# Author: Patrick brown

on:
  schedule:
    # Runs at minute 0 of every 6th hour (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger execution anytime from the UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants write access to repository contents
    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE
      - name: Checkout Repository Code
        uses: actions/checkout@v4.2.2

      # Sets up the Python environment 
      - name: Set up Python Environment
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'
          cache: 'pip'

      # Installs Linux system dependencies needed for Tkinter
      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      # Installs Python dependencies (Make sure 'tkinter' is removed from requirements.txt)
      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Runs the unit tests
      - name: Run Unit Tests
        run: python -m unittest test_weather_pipeline.py

      # Runs the weather pipeline
      - name: Run Weather Pipeline
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python weather_pipeline.py

      # Commits the changes to the repository
      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add weather_history.csv
          git commit -m "Automated update: Added fresh weather records" || echo "No changes to commit"
          git pull origin main --rebase
          git push origin HEAD:main

